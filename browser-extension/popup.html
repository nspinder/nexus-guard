<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NexusGuard</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <div id="auth-section" class="section" style="display: none;">
      <h2>🔐 Login Required</h2>
      <p>Please log in to NexusGuard to use the browser extension.</p>

      <div class="form-group">
        <label>Email</label>
        <input type="email" id="email" placeholder="your@email.com">
      </div>

      <div class="form-group">
        <label>Auth Token</label>
        <input type="password" id="token" placeholder="Your NexusGuard auth token">
      </div>

      <p class="hint">📍 Get your token from <a href="http://localhost:3000" target="_blank">NexusGuard Dashboard</a></p>

      <button id="login-btn" class="btn btn-primary">Login</button>
    </div>

    <div id="authenticated-section" style="display: none;">
      <div class="header">
        <h1>🛡️ NexusGuard</h1>
        <div class="user-info">
          <span id="user-email"></span>
          <button id="logout-btn" class="btn-icon">⏚</button>
        </div>
      </div>

      <div class="url-scanner">
        <div class="form-group">
          <label>Scan URL</label>
          <input type="text" id="scan-input" placeholder="https://example.com">
          <button id="scan-btn" class="btn btn-primary">Scan</button>
        </div>
      </div>

      <div id="scan-result" style="display: none;">
        <div class="result-box">
          <div id="result-content"></div>
        </div>
      </div>

      <div class="stats">
        <p>📊 This page has <span id="link-count">0</span> links</p>
        <p id="suspicious-count" style="display: none;">⚠️ <span id="suspicious-num">0</span> suspicious links detected</p>
      </div>

      <div class="scan-page-btn-wrapper">
        <button id="scan-page-btn" class="btn btn-secondary">Scan All Links</button>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
